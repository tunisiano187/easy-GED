# =============================================================================
# easy-GED — Configuration scanbd pour Brother DS-640
# (et tout scanner avec bouton physique, sans ADF)
#
# Fichier utilisé par autoscan.sh en mode SCAN_TRIGGER=button
#
# Installation :
#   apt-get install -y scanbd
#   # autoscan.sh utilise ce fichier directement via -c
#   # Pas besoin de le copier dans /etc/scanbd/
#
# Documentation scanbd : https://scanbd.sourceforge.net/
# =============================================================================

global {
    # Niveau de log : 0=silence, 1=erreurs, 2=warnings, 3=info, 7=debug
    debug-level = 1

    # Utilisateur d'exécution (root requis pour l'accès USB)
    user = root
    group = root

    # Fichier PID
    pidfile = /var/run/scanbd.pid

    # Intervalle de scrutation du bouton en millisecondes
    # 500ms = bon compromis réactivité / charge CPU
    timeout = 500

    # Répertoire contenant les scripts d'action
    # autoscan.sh passe le bon chemin au démarrage
    scriptdir = /opt/easy-ged-pi/scanner

    # Variables d'environnement passées aux scripts
    # (peuvent être surchargées dans autoscan.service)
    environment {
        CONSUME_DIR      = "/opt/easy-ged-pi/consume"
        SCAN_RESOLUTION  = "300"
        SCAN_MODE        = "Color"
        SCAN_DEVICE      = ""
    }
}

# =============================================================================
# Configuration du scanner Brother DS-640
# Le filtre "brother5:.*" correspond aux scanners détectés par le driver brscan5
# =============================================================================
device {
    # Correspond au nom SANE du scanner (ex: brother5:bus6;dev2)
    # Vérifier avec : scanimage -L
    filter = "^brother5:.*"
    desc   = "Brother DS-640 (brscan5)"

    # ------------------------------------------------------------------
    # Action : appui sur le bouton de scan
    # Le bouton physique "Scan" du DS-640 est exposé via SANE
    # comme une option booléenne qui passe de 0 à 1 lors de l'appui
    # ------------------------------------------------------------------
    action scan {
        # Filtre sur le nom de l'option SANE du bouton
        # Pour Brother brscan5 : "button-0" ou "scan-button"
        # Vérifier avec : scanimage -d <device> -A | grep -i button
        filter = "^button-[0-9]+$"
        desc   = "Bouton Scan du Brother DS-640"

        # Script appelé lors de l'appui (relatif à scriptdir)
        script = "scan-button.sh"

        # Déclenchement quand la valeur passe de "0" (non pressé) à "1" (pressé)
        string-trigger {
            from-value = "0"
            to-value   = "1"
        }
    }
}

